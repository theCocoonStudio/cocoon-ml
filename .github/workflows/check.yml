name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy for the array model (since 2026-10-09): the sandbox has Debian's 1.24.2, the runner
      # has no distribution package, so the same version from PyPI, pinned; no advisory against it
      # (GitHub's database, 2026-10-11). The suite failed to import seven modules without it on
      # every run of this branch since the port.
      - run: pip install numpy==1.24.2
      - run: python3 -m compileall -q cocoonml tests
      - run: python3 -m unittest
